upstream collabel_django {
    server app:8000;
}

upstream collabel_ws {
    server app:8001;
}

server {
    listen 80;
    listen [::]:80;

    location /static/ {
        alias /collabel/static/;
    }

    location /ws {
        proxy_pass http://collabel_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://collabel_django;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }
}
